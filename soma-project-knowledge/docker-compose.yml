services:
  pgvector:
    image: pgvector/pgvector:pg17
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: soma_knowledge
      POSTGRES_USER: soma
      POSTGRES_PASSWORD: soma
    volumes:
      - ./setup/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soma -d soma_knowledge"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
